<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>सुपर एडमिन - होटल मैनेजमेंट</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 10px; width: 100%; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #0f172a; color: white; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-green { background: #10b981; }
        .btn-red { background: #ef4444; }
        .btn-blue { background: #3b82f6; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 80%; max-height: 80vh; overflow-y: auto; border-radius: 10px; }
        .close { float: right; font-size: 28px; cursor: pointer; color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #0f172a;">सुपर एडमिन कंट्रोल पैनल</h1>
        
        <!-- 1. नया होटल रजिस्ट्रेशन फॉर्म -->
        <div class="card">
            <h2>🏨 नया होटल रजिस्टर करें</h2>
            <div class="form-group">
                <label>होटल का नाम:</label>
                <input type="text" id="hotelName" placeholder="उदा. राजपूताना भोजनालय">
            </div>
            <div class="form-group">
                <label>स्टोर कोड (यूनिक):</label>
                <input type="text" id="storeCode" placeholder="उदा. 101">
            </div>
            <div class="form-group">
                <label>मास्टर पिन (6 अंक):</label>
                <input type="password" id="masterPin" placeholder="उदा. 123456">
            </div>
            <div class="form-group">
                <label>कुल टेबल्स:</label>
                <input type="number" id="totalTables" placeholder="उदा. 10">
            </div>
            <button class="btn btn-green" onclick="registerHotel()">होटल रजिस्टर करें</button>
            <p id="regMsg" style="font-weight: bold; margin-top: 10px;"></p>
        </div>

        <!-- 2. रेस्टोरेंट लिस्ट और कंट्रोल -->
        <div class="card">
            <h2>📋 सभी रजिस्टर्ड रेस्टोरेंट / होटल</h2>
            <table id="restaurantTable">
                <thead>
                    <tr>
                        <th>स्टोर कोड</th>
                        <th>होटल का नाम</th>
                        <th>टेबल्स</th>
                        <th>स्टेटस</th>
                        <th>एक्शन</th>
                        <th>राशन देखें</th>
                    </tr>
                </thead>
                <tbody id="restaurantBody"></tbody>
            </table>
        </div>

        <!-- 3. कंबाइंड राशन लिस्ट (डेट फिल्टर के साथ) -->
        <div class="card">
            <h2>🛒 सभी होटलों की कुल राशन मांग</h2>
            <label style="font-weight: bold;">तारीख चुनें: </label>
            <input type="date" id="dateFilter" onchange="loadAllRationDemands()" style="width: 250px; display: inline-block;">
            <table id="allRationTable">
                <thead>
                    <tr>
                        <th>तारीख व समय</th>
                        <th>स्टोर कोड</th>
                        <th>सामग्री</th>
                        <th>मात्रा</th>
                    </tr>
                </thead>
                <tbody id="allRationBody"></tbody>
            </table>
        </div>
    </div>

    <!-- मॉडल (पॉपअप) किसी एक होटल का राशन देखने के लिए -->
    <div id="rationModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">राशन लिस्ट</h2>
            <table id="modalTable">
                <thead>
                    <tr><th>तारीख व समय</th><th>सामग्री</th><th>मात्रा</th></tr>
                </thead>
                <tbody id="modalBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://hbewnquphiwvxaxittrl.supabase.co';
        const supabaseKey = 'sb_publishable_HA1-PBV55kEZet2GG_IBdg_HjUzfOxf'; // आपकी Supabase API Key
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function registerHotel() {
            const name = document.getElementById('hotelName').value;
            const code = document.getElementById('storeCode').value;
            const pin = document.getElementById('masterPin').value;
            const tables = document.getElementById('totalTables').value;

            if(!name || !code || !pin || !tables) {
                alert("कृपया रजिस्ट्रेशन के लिए सभी जानकारी भरें!");
                return;
            }

            const { data, error } = await supabase.from('restaurants').insert([
                { name: name, store_code: code, master_pin: pin, total_tables: parseInt(tables), is_active: true }
            ]);

            const msgLabel = document.getElementById('regMsg');
            if (error) {
                msgLabel.style.color = 'red';
                msgLabel.innerText = "एरर: यह स्टोर कोड पहले से मौजूद हो सकता है।";
            } else {
                msgLabel.style.color = 'green';
                msgLabel.innerText = "✅ होटल सफलतापूर्वक रजिस्टर हो गया!";
                document.getElementById('hotelName').value = '';
                document.getElementById('storeCode').value = '';
                document.getElementById('masterPin').value = '';
                document.getElementById('totalTables').value = '';
                loadRestaurants(); // लिस्ट तुरंत अपडेट करें
            }
        }

        async function loadRestaurants() {
            const { data, error } = await supabase.from('restaurants').select('*');
            if (error) return;
            
            const tbody = document.getElementById('restaurantBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">अभी कोई होटल रजिस्टर नहीं है।</td></tr>';
                return;
            }

            data.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${r.store_code}</b></td>
                    <td>${r.name}</td>
                    <td>${r.total_tables}</td>
                    <td style="color: ${r.is_active ? 'green' : 'red'}"><b>${r.is_active ? 'चालू' : 'ब्लॉक'}</b></td>
                    <td>
                        <button class="btn ${r.is_active ? 'btn-red' : 'btn-green'}" onclick="toggleStatus('${r.store_code}', ${r.is_active})">
                            ${r.is_active ? 'ब्लॉक करें' : 'चालू करें'}
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-blue" onclick="viewSingleRestaurantRation('${r.store_code}')">राशन देखें</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleStatus(code, currentStatus) {
            await supabase.from('restaurants').update({ is_active: !currentStatus }).eq('store_code', code);
            loadRestaurants();
        }

        async function viewSingleRestaurantRation(code) {
            document.getElementById('modalTitle').innerText = `स्टोर ${code} की राशन मांग`;
            const { data, error } = await supabase.from('ration_demands').select('*').eq('store_code', code).order('created_at', { ascending: false });
            
            const tbody = document.getElementById('modalBody');
            tbody.innerHTML = '';
            
            if (data && data.length > 0) {
                data.forEach(d => {
                    const dateObj = new Date(d.created_at);
                    const formattedDate = dateObj.toLocaleDateString('hi-IN') + " " + dateObj.toLocaleTimeString('hi-IN');
                    tbody.innerHTML += `<tr><td>${formattedDate}</td><td>${d.item_name}</td><td>${d.quantity}</td></tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">कोई राशन मांग नहीं मिली।</td></tr>';
            }
            document.getElementById('rationModal').style.display = 'block';
        }

        function closeModal() { 
            document.getElementById('rationModal').style.display = 'none'; 
        }

        async function loadAllRationDemands() {
            let query = supabase.from('ration_demands').select('*').order('created_at', { ascending: false });
            
            const filterDate = document.getElementById('dateFilter').value;
            if (filterDate) {
                // अगर डेट चुनी है, तो सिर्फ उस दिन का डेटा दिखाएगा
                query = query.gte('created_at', `${filterDate}T00:00:00`).lte('created_at', `${filterDate}T23:59:59`);
            }

            const { data, error } = await query;
            const tbody = document.getElementById('allRationBody');
            tbody.innerHTML = '';
            
            if (data && data.length > 0) {
                data.forEach(d => {
                    const dateObj = new Date(d.created_at);
                    const formattedDate = dateObj.toLocaleDateString('hi-IN') + " " + dateObj.toLocaleTimeString('hi-IN');
                    tbody.innerHTML += `<tr><td>${formattedDate}</td><td><b>${d.store_code}</b></td><td>${d.item_name}</td><td>${d.quantity}</td></tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">इस तारीख पर कोई राशन मांग नहीं है।</td></tr>';
            }
        }

        window.onload = () => {
            // पेज लोड होते ही आज की तारीख सेट हो जाएगी
            document.getElementById('dateFilter').valueAsDate = new Date();
            loadRestaurants();
            loadAllRationDemands();
        };
    </script>
</body>
</html>
