<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हलवाई मास्टर किराना व भट्ठी पर्ची कैलकुलेटर</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { margin: 0; padding: 12px; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #b91c1c; margin: 0 0 15px 0; font-size: 22px; }
    
    .settings-panel { background: #fff7ed; border: 1px solid #fdba74; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #9a3412; }
    .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: #fff; }
    
    .category-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pill { padding: 6px 14px; font-size: 13px; background: #e2e8f0; border: none; border-radius: 20px; cursor: pointer; font-weight: 500; }
    .pill.active { background: #b91c1c; color: #fff; font-weight: bold; }
    
    .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; margin-bottom: 15px; }
    .dish-card { display: flex; align-items: center; gap: 8px; background: #fff; padding: 7px 10px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; font-size: 13px; }
    .dish-card input { cursor: pointer; }
    
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    button.btn { border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .btn-red { background: #b91c1c; color: white; }
    .btn-blue { background: #0284c7; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-gray { background: #64748b; color: white; }
    
    .parchi-box { border: 2px solid #0f172a; padding: 15px; border-radius: 8px; background: #fff; }
    .parchi-header { border-bottom: 2px dashed #0f172a; padding-bottom: 10px; margin-bottom: 12px; }
    .parchi-title { font-size: 18px; font-weight: bold; color: #0f172a; }
    .cat-head { background: #e2e8f0; padding: 6px 10px; font-weight: bold; font-size: 14px; margin-top: 15px; border-left: 5px solid #b91c1c; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: left; font-size: 13px; }
    th { background: #f1f5f9; color: #334155; }
    td strong { color: #0f172a; }
    
    @media print {
      body { background: #fff; padding: 0; }
      .container { box-shadow: none; padding: 0; max-width: 100%; }
      .settings-panel, .category-pills, .dishes-grid, .btn-row, h1 { display: none; }
      .parchi-box { border: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>कैटरिंग किराना, भट्ठी व धुलाई पर्ची सिस्टम</h1>

  <div class="settings-panel">
    <div class="form-group">
      <label>कुल मेहमान (Guests):</label>
      <input type="number" id="guestCount" value="1200" min="50" step="50" oninput="calculateKirana()">
    </div>
    <div class="form-group">
      <label>पसंदीदा कुकिंग तेल (Brand & Type):</label>
      <select id="oilChoice" onchange="calculateKirana()">
        <option value="फॉर्च्यून सोयाबीन तेल (Fortune Soya)">फॉर्च्यून सोयाबीन तेल (15 L Tin)</option>
        <option value="फॉर्च्यून मूंगफली तेल (Fortune Groundnut)">फॉर्च्यून मूंगफली तेल (15 L Tin)</option>
        <option value="सलोनी / बैल कोल्हू सरसों तेल (Mustard)">सलोनी / बैल कोल्हू सरसों तेल (15 L Tin)</option>
        <option value="फॉर्च्यून सनलाइट सनफ्लावर तेल">फॉर्च्यून सनफ्लावर तेल (15 L Tin)</option>
      </select>
    </div>
    <div class="form-group">
      <label>देसी घी ब्रांड (Pure Ghee):</label>
      <select id="gheeChoice" onchange="calculateKirana()">
        <option value="अमूल देसी घी (Amul Ghee)">अमूल देसी घी (15 Kg Tin / Pkt)</option>
        <option value="गोवर्धन / सरस देसी घी">गोवर्धन / सरस देसी घी</option>
        <option value="नेस्ले / मिल्कफूड देसी घी">मिल्कफूड / नोवा देसी घी</option>
      </select>
    </div>
    <div class="form-group">
      <label>पकवान खोजें:</label>
      <input type="text" id="dishSearch" placeholder="सब्जी, मिठाई या स्टार्टर खोजें..." onkeyup="filterDishes()">
    </div>
  </div>

  <div class="category-pills" id="categoryPills">
    <button class="pill active" onclick="setCategory('All', this)">सभी (All)</button>
    <button class="pill" onclick="setCategory('मिठाई', this)">मिठाई</button>
    <button class="pill" onclick="setCategory('सब्जी व पनीर', this)">सब्जी व पनीर</button>
    <button class="pill" onclick="setCategory('दाल व कढ़ी', this)">दाल व कढ़ी</button>
    <button class="pill" onclick="setCategory('रोटी व पूड़ी', this)">रोटी व पूड़ी</button>
    <button class="pill" onclick="setCategory('चावल व पुलाव', this)">चावल व पुलाव</button>
    <button class="pill" onclick="setCategory('नाश्ता व स्टार्टर', this)">नाश्ता व स्टार्टर</button>
    <button class="pill" onclick="setCategory('चाइनीज व फास्टफूड', this)">चाइनीज व फास्टफूड</button>
    <button class="pill" onclick="setCategory('रायता व अन्य', this)">रायता व अन्य</button>
  </div>

  <div class="dishes-grid" id="dishesList"></div>

  <div class="btn-row">
    <button class="btn btn-red" onclick="calculateKirana()">पर्ची अपडेट करें</button>
    <button class="btn btn-green" onclick="shareWhatsApp()">व्हाट्सएप पर शेयर करें</button>
    <button class="btn btn-blue" onclick="window.print()">प्रिंट / PDF सेव करें</button>
    <button class="btn btn-gray" onclick="clearSelections()">सब हटाएं</button>
  </div>

  <div class="parchi-box" id="printableArea">
    <div class="parchi-header">
      <div class="parchi-title">कैटरिंग कच्ची किराना व भट्ठी सामग्री पर्ची</div>
      <div style="font-size: 13px; margin-top: 4px; color: #475569;">
        कुल व्यक्ति: <strong id="outGuest">1200</strong> |

      </div>
      <div style="font-size: 12px; margin-top: 4px; color: #64748b;" id="selectedDishesSummary"></div>
    </div>

    <div id="parchiContent"></div>
  </div>
</div>

let selectedCategory = "All";
const selectedDishes = new Set();

function renderDishes() {
  const container = document.getElementById("dishesList");
  container.innerHTML = "";
  const query = document.getElementById("dishSearch").value.trim().toLowerCase();

  dishDatabase.forEach(dish => {
    const matchCat = (selectedCategory === "All" || dish.cat === selectedCategory);
    const matchSearch = dish.name.toLowerCase().includes(query);
    if (matchCat && matchSearch) {
      const card = document.createElement("label");
      card.className = "dish-card";
      const isChecked = selectedDishes.has(dish.id) ? "checked" : "";
      card.innerHTML = `<input type="checkbox" value="${dish.id}" ${isChecked} onchange="toggleDish(${dish.id})"> <span>${dish.name}</span>`;
      container.appendChild(card);
    }
  });
}

function setCategory(cat, btn) {
  selectedCategory = cat;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  renderDishes();
}

function filterDishes() {
  renderDishes();
}

function toggleDish(id) {
  if (selectedDishes.has(id)) {
    selectedDishes.delete(id);
  } else {
    selectedDishes.add(id);
  }
  calculateKirana();
}

function clearSelections() {
  selectedDishes.clear();
  renderDishes();
  calculateKirana();
}

function calculateKirana() {
  const guests = parseFloat(document.getElementById("guestCount").value) || 0;
  document.getElementById("outGuest").innerText = guests;
  document.getElementById("outDishCount").innerText = selectedDishes.size;

  const factor = guests / 100;
  const oilBrand = document.getElementById("oilChoice").value;
  const gheeBrand = document.getElementById("gheeChoice").value;

  const rawAgg = {};
  const names = [];

  selectedDishes.forEach(id => {
    const dish = dishDatabase.find(d => d.id === id);
    if (dish) {
      names.push(dish.name);
      for (const [item, data] of Object.entries(dish.r)) {
        let finalItemName = item;
        let [qty, unit, cat] = data;

        // ब्रांड रिप्लेसमेंट
        if (item === "रिफाइंड तेल") {
          finalItemName = oilBrand;
        } else if (item === "देसी घी") {
          finalItemName = gheeBrand;
        }

        if (!rawAgg[finalItemName]) {
          rawAgg[finalItemName] = { qty: 0, unit: unit, cat: cat };
        }
        rawAgg[finalItemName].qty += (qty * factor);
      }
    }
  });

  document.getElementById("selectedDishesSummary").innerText = names.length > 0 ? "चुने गए पकवान: " + names.join(", ") : "कृपया ऊपर मेन्यू में से पकवान चुनें।";

  // अगर कोई पकवान चुना है तो शादी के सामान्य किराना मसाले (Tata Salt, MDH, Jeera आदि) अपने आप जोड़ें
  if (selectedDishes.size > 0) {
    const stdSpices = [
      { name: "टाटा नमक (Tata Salt)", qty: Math.max(1, Math.round(guests * 0.012)), unit: "किलो", cat: "मसाले" },
      { name: "हल्दी पाउडर (MDH / Catch / Everest)", qty: Math.max(0.5, (guests * 0.002).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "लाल मिर्च पाउडर तीखा (MDH / Everest)", qty: Math.max(0.5, (guests * 0.0025).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "कश्मीरी लाल मिर्च (रंग वाली)", qty: Math.max(0.2, (guests * 0.001).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "धनिया पाउडर (MDH / Everest)", qty: Math.max(0.5, (guests * 0.003).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "जीरा साबुत (जीरा तड़का)", qty: Math.max(0.5, (guests * 0.002).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "गरम मसाला (MDH किचन किंग / गरम मसाला)", qty: Math.max(0.2, (guests * 0.0012).toFixed(1)), unit: "किलो", cat: "मसाले" },
      { name: "कसूरी मेथी (Kasuri Methi)", qty: Math.max(0.2, (guests * 0.0005).toFixed(2)), unit: "किलो", cat: "मसाले" },
      { name: "हींग (वंदना / कैच स्ट्रॉन्ग)", qty: Math.max(25, Math.round(guests * 0.12)), unit: "ग्राम", cat: "मसाले" },
      { name: "खड़ा गरम मसाला मिक्स (लौंग, इलायची, तेजपत्ता, दालचीनी)", qty: Math.max(0.25, (guests * 0.0008).toFixed(2)), unit: "किलो", cat: "मसाले" }
    ];

    stdSpices.forEach(sp => {
      if (!rawAgg[sp.name]) {
        rawAgg[sp.name] = { qty: parseFloat(sp.qty), unit: sp.unit, cat: sp.cat };
      } else {
        rawAgg[sp.name].qty += parseFloat(sp.qty);
      }
    });

    // भट्ठी, गैस व बर्तन सफाई का सामान (ऑटोमैटिक कैटरिंग फॉर्मूला)
    const bhattiSupplies = [
      { name: "कमर्शियल गैस सिलेंडर (19 kg लाल/नीला)", qty: Math.max(2, Math.ceil(guests / 130)), unit: "सिलेंडर", cat: "सफाईगैस" },
      { name: "बर्तन धोने व पोंछने के फटे कपड़े (कॉटन कतरन / वेस्ट)", qty: Math.max(2, Math.ceil(guests / 220)), unit: "किलो", cat: "सफाईगैस" },
      { name: "रद्दी पेपर (न्यूज़पेपर / अखबार की रद्दी)", qty: Math.max(3, Math.ceil(guests / 160)), unit: "किलो", cat: "सफाईगैस" },
      { name: "डिटर्जेंट पाउडर (घड़ी / निरमा सर्फ़)", qty: Math.max(2, Math.ceil(guests / 150)), unit: "किलो", cat: "सफाईगैस" },
      { name: "बर्तन धोने का साबुन (Vim Bar / टिकिया)", qty: Math.max(4, Math.ceil(guests / 100)), unit: "टिकिया", cat: "सफाईगैस" },
      { name: "स्टील जूना / जाली स्क्रबर (बर्तनों के लिए)", qty: Math.max(4, Math.ceil(guests / 80)), unit: "पीस", cat: "सफाईगैस" },
      { name: "एल्युमिनियम फॉयल रोल (खाना ढकने/पैकिंग)", qty: Math.max(1, Math.ceil(guests / 400)), unit: "रोल (1 kg)", cat: "सफाईगैस" },
      { name: "माचिस बंडल (भट्ठी जलाने के लिए)", qty: Math.max(1, Math.ceil(guests / 500)), unit: "बंडल (10 डिब्बी)", cat: "सफाईगैस" }
    ];

    bhattiSupplies.forEach(bs => {
      rawAgg[bs.name] = { qty: bs.qty, unit: bs.unit, cat: bs.cat };
    });
  }

  renderParchi(rawAgg);
}

function renderParchi(aggregated) {
  const container = document.getElementById("parchiContent");
  container.innerHTML = "";

  const keys = Object.keys(aggregated);
  if (keys.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 20px; color:#64748b;">ऊपर दिए गए मेन्यू में से शादी के पकवान चुनें। पूरी पर्ची ऑटोमैटिक तैयार हो जाएगी।</div>`;
    return;
  }

  const sections = [
    { key: "तेलघी", title: "🛢️ तेल, डालडा व देसी घी (टिन व खुला हिसाब)" },
    { key: "अनाज", title: "🌾 आटा, मैदा, दालें व चावल (कट्टा व किलो)" },
    { key: "मसाले", title: "🧂 खड़े व पिसे ब्रांडेड मसाले (MDH / Tata / Catch)" },
    { key: "डेयरी", title: "🥛 डेयरी, दूध, मावा, पनीर व मक्खन" },
    { key: "किराना", title: "🥫 सॉस, पैक्ड किराना व चीनी" },
    { key: "सूखामेवा", title: "🥜 काजू, किशमिश व सूखा मेवा" },
    { key: "सब्जी", title: "🍅 ताजी सब्जियां व ग्रेवी सामग्री" },
    { key: "सफाईगैस", title: "🔥 भट्ठी, गैस सिलेंडर, सफाई, रद्दी व बर्तन धुलाई सामग्री" }
  ];

  let serial = 1;

  sections.forEach(sec => {
    const itemsInSec = keys.filter(k => aggregated[k].cat === sec.key);
    if (itemsInSec.length > 0) {
      const secDiv = document.createElement("div");
      secDiv.className = "cat-head";
      secDiv.innerText = sec.title;
      container.appendChild(secDiv);

      const tbl = document.createElement("table");
      tbl.innerHTML = `<thead><tr><th style="width: 50px;">क्र.</th><th>सामान का नाम (Brand & Item Name)</th><th style="width: 170px;">मात्रा (Quantity)</th></tr></thead><tbody></tbody>`;
      const tbody = tbl.querySelector("tbody");

      itemsInSec.sort().forEach(itemName => {
        const item = aggregated[itemName];
        let val = (item.qty >= 10) ? Math.round(item.qty * 10) / 10 : Math.round(item.qty * 100) / 100;
        
        // तेल व घी के लिए टिन (15 लीटर/किलो) में कनवर्ट करके दिखाना
        let extraTinInfo = "";
        if (item.unit === "लीटर" || item.unit === "किलो") {
          if (itemName.includes("तेल") || itemName.includes("घी")) {
            const tins = Math.floor(val / 15);
            const rem = Math.round((val % 15) * 10) / 10;
            if (tins > 0) {
              extraTinInfo = ` <strong>[${tins} टिन (15L)` + (rem > 0 ? ` + ${rem} ${item.unit} खुला]` : `]</strong>`);
            }
          }
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${serial++}</td><td><strong>${itemName}</strong></td><td>${val} ${item.unit}${extraTinInfo}</td>`;
        tbody.appendChild(tr);
      });

      container.appendChild(tbl);
    }
  });
}

function shareWhatsApp() {
  const guests = document.getElementById("guestCount").value;
  const tables = document.querySelectorAll("#parchiContent table");
  if (tables.length === 0) {
    alert("कृपया पहले कम से कम एक पकवान चुनें!");
    return;
  }

  let text = `*शादी/कैटरिंग हलवाई कच्ची किराना पर्ची (${guests} व्यक्ति)*\n`;
  text += document.getElementById("selectedDishesSummary").innerText + "\n\n";

  const heads = document.querySelectorAll("#parchiContent .cat-head");
  heads.forEach((h, idx) => {
    text += `\n*${h.innerText}*\n`;
    const rows = tables[idx].querySelectorAll("tbody tr");
    rows.forEach(r => {
      const cols = r.querySelectorAll("td");
      text += `${cols[0].innerText}. ${cols[1].innerText} - ${cols[2].innerText}\n`;
    });
  });

  const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
  window.open(url, '_blank');
}
