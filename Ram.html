<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हलवाई किराना पर्ची कैलकुलेटर</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { margin: 0; padding: 15px; background: #f4f6f9; color: #222; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #b73212; margin-top: 0; font-size: 24px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 15px; background: #fff7ed; padding: 12px; border-radius: 8px; border: 1px solid #fed7aa; }
    .top-bar label { font-weight: bold; font-size: 15px; }
    .top-bar input[type="number"] { width: 120px; padding: 8px; font-size: 16px; border: 1px solid #d97706; border-radius: 5px; }
    .top-bar input[type="text"] { flex: 1; min-width: 180px; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }
    .category-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .pill { padding: 6px 12px; font-size: 13px; background: #eee; border: none; border-radius: 20px; cursor: pointer; }
    .pill.active { background: #b73212; color: #fff; font-weight: bold; }
    .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 320px; overflow-y: auto; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 20px; background: #fafafa; }
    .dish-card { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 10px; border-radius: 6px; border: 1px solid #e5e7eb; cursor: pointer; font-size: 14px; }
    .dish-card input { cursor: pointer; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    button.action-btn { background: #b73212; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
    button.action-btn:hover { background: #9a250b; }
    button.btn-sec { background: #2563eb; }
    button.btn-sec:hover { background: #1d4ed8; }
    button.btn-clear { background: #6b7280; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #b73212; color: #fff; }
    tr:nth-child(even) { background: #f9fafb; }
    .summary-text { font-size: 13px; color: #666; margin-top: 6px; }
    @media print {
      body { background: #fff; padding: 0; }
      .container { box-shadow: none; padding: 0; }
      .top-bar, .category-pills, .dishes-grid, .btn-row, h1 { display: none; }
      #printableArea { display: block !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>हलवाई मेन्यू व कच्ची किराना पर्ची कैलकुलेटर</h1>

  <div class="top-bar">
    <label>कुल मेहमान (Guests):</label>
    <input type="number" id="guestCount" value="500" min="10" step="10" oninput="calculateKirana()">
    <input type="text" id="dishSearch" placeholder="पकवान खोजें (उदा: पनीर, रसगुल्ला)..." onkeyup="filterDishes()">
  </div>

  <div class="category-pills" id="categoryPills">
    <button class="pill active" onclick="setCategory('All', this)">सभी (All)</button>
    <button class="pill" onclick="setCategory('मिठाई', this)">मिठाई</button>
    <button class="pill" onclick="setCategory('सब्जी व पनीर', this)">सब्जी व पनीर</button>
    <button class="pill" onclick="setCategory('दाल व कढ़ी', this)">दाल व कढ़ी</button>
    <button class="pill" onclick="setCategory('रोटी व पूड़ी', this)">रोटी व पूड़ी</button>
    <button class="pill" onclick="setCategory('चावल व पुलाव', this)">चावल व पुलाव</button>
    <button class="pill" onclick="setCategory('नाश्ता व स्टार्टर', this)">नाश्ता व स्टार्टर</button>
    <button class="pill" onclick="setCategory('रायता व अन्य', this)">रायता व अन्य</button>
  </div>

  <div class="dishes-grid" id="dishesList"></div>

  <div class="btn-row">
    <button class="action-btn" onclick="calculateKirana()">पर्ची अपडेट करें</button>
    <button class="action-btn btn-sec" onclick="shareWhatsApp()">व्हाट्सएप पर शेयर करें</button>
    <button class="action-btn btn-sec" onclick="window.print()">पर्ची प्रिंट / PDF सेव करें</button>
    <button class="action-btn btn-clear" onclick="clearSelections()">सब हटाएं</button>
  </div>

  <div id="printableArea">
    <h3 style="margin-bottom: 5px;">सामान की कच्ची पर्ची (<span id="outGuest">500</span> व्यक्ति)</h3>
    <div class="summary-text" id="selectedDishesSummary"></div>
    <table id="resultTable">
      <thead>
        <tr>
          <th style="width: 60px;">क्र.सं.</th>
          <th>सामान का नाम (Kirana Item)</th>
          <th style="width: 140px;">अनुमानित मात्रा</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" style="text-align: center;">ऊपर दिए गए मेन्यू में से पकवान चुनें।</td></tr>
      </tbody>
    </table>
  </div>
</div>

let selectedCategory = "All";
const selectedDishes = new Set();

function renderDishes() {
  const container = document.getElementById("dishesList");
  container.innerHTML = "";
  const query = document.getElementById("dishSearch").value.trim().toLowerCase();

  dishDatabase.forEach(dish => {
    const matchCat = (selectedCategory === "All" || dish.cat === selectedCategory);
    const matchSearch = dish.name.toLowerCase().includes(query);
    if (matchCat && matchSearch) {
      const card = document.createElement("label");
      card.className = "dish-card";
      const isChecked = selectedDishes.has(dish.id) ? "checked" : "";
      card.innerHTML = `<input type="checkbox" value="${dish.id}" ${isChecked} onchange="toggleDish(${dish.id})"> <span>${dish.name}</span>`;
      container.appendChild(card);
    }
  });
}

function setCategory(cat, btn) {
  selectedCategory = cat;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  renderDishes();
}

function filterDishes() {
  renderDishes();
}

function toggleDish(id) {
  if (selectedDishes.has(id)) {
    selectedDishes.delete(id);
  } else {
    selectedDishes.add(id);
  }
  calculateKirana();
}

function clearSelections() {
  selectedDishes.clear();
  renderDishes();
  calculateKirana();
}

function calculateKirana() {
  const guests = parseFloat(document.getElementById("guestCount").value) || 0;
  document.getElementById("outGuest").innerText = guests;
  const factor = guests / 100;
  const aggregated = {};
  const names = [];

  selectedDishes.forEach(id => {
    const dish = dishDatabase.find(d => d.id === id);
    if (dish) {
      names.push(dish.name);
      for (const [item, data] of Object.entries(dish.r)) {
        const [qty, unit] = data;
        if (!aggregated[item]) {
          aggregated[item] = { qty: 0, unit: unit };
        }
        aggregated[item].qty += (qty * factor);
      }
    }
  });

  document.getElementById("selectedDishesSummary").innerText = names.length > 0 ? "चुने गए पकवान: " + names.join(", ") : "कोई पकवान नहीं चुना गया";

  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";

  const keys = Object.keys(aggregated);
  if (keys.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">मेन्यू में से पकवान चुनें, लिस्ट यहां अपने आप बन जाएगी।</td></tr>`;
    return;
  }

  let index = 1;
  keys.sort().forEach(item => {
    const row = document.createElement("tr");
    const val = aggregated[item].qty;
    const formattedQty = (val >= 10) ? Math.round(val * 10) / 10 : Math.round(val * 100) / 100;
    row.innerHTML = `
      <td>${index++}</td>
      <td><strong>${item}</strong></td>
      <td>${formattedQty} ${aggregated[item].unit}</td>
    `;
    tbody.appendChild(row);
  });
}

function shareWhatsApp() {
  const guests = document.getElementById("guestCount").value;
  const rows = document.querySelectorAll("#resultTable tbody tr");
  if (rows.length === 0 || rows[0].innerText.includes("कोई पकवान नहीं")) {
    alert("कृपया पहले कम से कम एक पकवान चुनें!");
    return;
  }

  let text = `*शादी/कैटरिंग किराना पर्ची (${guests} व्यक्ति)*\n`;
  text += document.getElementById("selectedDishesSummary").innerText + "\n\n";
  text += "*कच्चा सामान:*\n";

  rows.forEach(r => {
    const cols = r.querySelectorAll("td");
    if (cols.length === 3) {
      text += `${cols[0].innerText}. ${cols[1].innerText} - ${cols[2].innerText}\n`;
    }
  });

  const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
  window.open(url, '_blank');
}

selectedDishes.add(26); // शाही पनीर
selectedDishes.add(63); // पूड़ी
